<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Focus Protocols and Metrics Tracker</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="page">
  <header id="app-header">
    <div class="header-titles">
      <h1 class="header-title">Etienne Michelet <span class="header-site-title">Focus Protocols and Metrics Tracker</span></h1>
      <span class="header-tagline"><strong class="header-disclaimer">*Not a recommendation, only personal implementation.</strong></span>
    </div>
    <a
      class="header-youtube"
      href="https://www.youtube.com/channel/UCuEqqmTLeTL5pmE9NLTYPFQ"
      target="_blank"
      rel="noopener noreferrer"
    >YouTube ↗</a>
    <div id="unlock-area">
      <span id="unlock-status">Viewing publicly</span>
    </div>
  </header>

  <div id="shell">
    <!-- Protocol map: every protocol (rows) across every version (columns).
         Built from protocol-base.json (V1, the full Day 0 list) and the
         change lists protocol-v2.json, protocol-v3.json. Hover or tap a dot
         for its note. See js/protocol.js. -->
    <nav id="versions-column" aria-label="Protocol versions">
      <section class="secondary-panel map-panel">
        <div class="map-head">
          <h2 class="map-title">Protocol Versions</h2>
          <div class="personal-caption map-caption">V1: protocols from Huberman Lab</div>
        </div>
        <div id="protocol-map"></div>
      </section>
    </nav>

    <main id="metrics-area" aria-label="90-Day Focus Metrics">
      <div class="metrics-header">
        <div class="metrics-titles">
          <h2 class="metrics-title">90-Day Focus Metrics</h2>
          <div id="metrics-updated" class="metrics-updated"></div>
        </div>
        <div id="day-indicator" class="day-indicator"></div>
      </div>
      <div id="metric-cards" class="metric-cards"></div>
    </main>

    <div id="protocol-column">
      <details id="sleep-panel" class="secondary-panel learned-dropdown">
        <summary class="version-summary">
          <span class="version-title">Sleep Protocols I've learned about</span>
        </summary>
        <div class="version-body">
          <div id="sleep-updated" class="protocol-updated learned-dropdown-updated"></div>
          <div id="sleep-body" class="protocol-body"></div>
        </div>
      </details>

      <details id="learning-panel" class="secondary-panel learned-dropdown">
        <summary class="version-summary">
          <span class="version-title">Learning Protocols I've learned about</span>
        </summary>
        <div class="version-body">
          <div id="learning-updated" class="protocol-updated learned-dropdown-updated"></div>
          <div id="learning-body" class="protocol-body"></div>
        </div>
      </details>
    </div>
  </div>
</div>

<script type="module" src="js/protocol.js"></script>
<script type="module" src="js/sleep.js"></script>
<script type="module" src="js/learning.js"></script>
<script type="module" src="js/metrics.js"></script>
</body>
</html>
